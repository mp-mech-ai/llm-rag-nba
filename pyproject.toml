[project]
name = "llm-ragas"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "easyocr>=1.7.2",
    "faiss-cpu==1.10.0",
    "fitz>=0.0.1.dev2",
    "google-genai>=1.60.0",
    "langchain>=0.3.27",
    "langchain-community>=0.3.27",
    "langchain-mistralai>=0.2.12",
    "logfire>=4.15.1",
    "mistralai>=1.10.1",
    "opencv-python>=4.11.0.86",
    "openpyxl>=3.1.5",
    "pandas==2.2.3",
    "pdf2image>=1.17.0",
    "pillow>=9.0.0",
    "pydantic>=2.12.5",
    "pymupdf>=1.22.0",
    "pypdf2==3.0.1",
    "pytesseract>=0.3.13",
    "python-docx==1.1.2",
    "python-dotenv==1.1.0",
    "requests==2.32.3",
    "streamlit==1.44.1",
    "tqdm>=4.67.1",
    "transformers>=5.0.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "fawltydeps>=0.20.0",
    "ruff>=0.14.14",
]
